name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: |
            output/*.geode
            build/*.geode
          if-no-files-found: error
